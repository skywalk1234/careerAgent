spring:
  application:
    name: resume-parser-service # 服务名称
  cloud:
    nacos:
      server-addr: 192.168.118.130:8848 # nacos地址
  ai:
    dashscope:
#      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: sk-2c1e9d35337d4deb8c7ff28b4f6c4193
      chat:
        options:
#          默认用qwen-plus 具体不同的可通过方法动态调整
          model: qwen-plus-2025-12-01
      embedding:
        options:
          model: text-embedding-v1
          dimensions: 1536

  datasource:
    url: jdbc:postgresql://192.168.118.130:5432/ai-vector
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5

  rabbitmq:
    host: 192.168.118.130 # 你的虚拟机IP
    port: 5672 # 端口
    virtual-host: / # 虚拟主机
    username: itheima # 用户名
    password: 123 # 密码
  jackson:
    default-property-inclusion: non_null  # 不序列化null值

  data:
    redis:
      host: 192.168.118.130
      port: 6379
      password:  # 如果有密码
      database: 0
      timeout: 2000ms
      connect-timeout: 1000ms
      lettuce:
        pool:
          max-active: 8       # 最大连接数
          max-idle: 8         # 最大空闲连接
          min-idle: 0         # 最小空闲连接
          max-wait: -1ms      # 获取连接最大等待时间，-1表示不限制

