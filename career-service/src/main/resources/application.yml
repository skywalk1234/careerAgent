spring:
  application:
    name: career-service # 服务名称
  cloud:
    nacos:
      server-addr: 192.168.118.130:8848 # nacos地址
  rabbitmq:
    host: 192.168.118.130 # 你的虚拟机IP
    port: 5672 # 端口
    virtual-host: / # 虚拟主机
    username: itheima # 用户名
    password: 123 # 密码
  elasticsearch:
    # Elasticsearch 连接配置
    uris: http://192.168.118.130:9200
    # 如果使用用户名密码
    # username: elastic
    # password: your-password

    # 连接池配置
    connection-timeout: 3s
    socket-timeout: 30s
  # DashScope API Key 配置
  # 可以通过环境变量 SPRING_AI_DASHSCOPE_API_KEY 设置，或在这里配置

# 自定义 DashScope 配置
dashscope:
  api-key: sk-2c1e9d35337d4deb8c7ff28b4f6c4193

    # 可选：禁用 SSL 证书验证（开发环境）
#    ssl:
#      certificate-authorities: ""
#      verification-mode: none
#

# Python AI 服务（ai-service-py）地址，JobRecommendClient 直连用，可覆盖
ai-service:
  url: http://127.0.0.1:8086

feign:
  client:
    config:
      # 针对特定服务配置 (resume-parser-service 是您在 @FeignClient 中定义的服务名)
      resume-parser-service:
        connectTimeout: 10000  # 连接超时：10秒
        readTimeout: 60000     # 读取超时：60秒 (根据 LLM 耗时调整，建议设大一点)
      # Python ai-service-py 直连客户端，readTimeout 需覆盖 DeepSeek 重排耗时
      ai-service-py:
        connectTimeout: 10000
        readTimeout: 60000
